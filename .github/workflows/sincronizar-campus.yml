name: Sincronizar campus

# Render gratis duerme el servidor cuando nadie lo usa. Cada 3 horas este flujo lo
# despierta y le pide traer las actividades nuevas de los campus de todos los usuarios.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a la API que sincronice
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET en GitHub; no se sincroniza."
            exit 0
          fi
          # El primer intento puede tardar mientras Render despierta
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --retry-all-errors --max-time 180 \
            -X POST -H "x-clave-cron: $CRON_SECRET" \
            https://kuadri.onrender.com/api/campus/sincronizar-todos
